<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Smart Tools Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Smart Tools Pro</h1>
        <p>All-in-one browser tools dashboard</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
    </nav>

    <div class="container">

        <input id="search" onkeyup="filterTools()" placeholder="Search tools...">

        <div class="grid">

            <!-- WORD COUNTER -->
            <div class="card" data-name="word counter">
                <h3>Word Counter</h3>
                <textarea id="text"></textarea>
                <button onclick="countWords()">Analyze</button>
                <div class="result">
                    Words: <span id="words">0</span><br>
                    Chars: <span id="chars">0</span><br>
                    Sentences: <span id="sentences">0</span>
                </div>
            </div>

            <!-- TEXT REVERSE -->
            <div class="card" data-name="reverse text">
                <h3>Text Reverse</h3>
                <textarea id="rev"></textarea>
                <button onclick="reverseText()">Reverse</button>
                <div class="result" id="revResult"></div>
            </div>

            <!-- PASSWORD -->
            <div class="card" data-name="password generator">
                <h3>Password Generator</h3>
                <input type="number" id="passLen" value="12">
                <button onclick="generatePassword()">Generate</button>
                <div class="result" id="passResult"></div>
            </div>

            <!-- BMI -->
            <div class="card" data-name="bmi calculator">
                <h3>BMI Calculator</h3>
                <input id="weight" placeholder="Weight kg">
                <input id="height" placeholder="Height cm">
                <button onclick="calcBMI()">Calculate</button>
                <div class="result" id="bmiResult"></div>
            </div>

            <!-- AGE -->
            <div class="card" data-name="age calculator">
                <h3>Age Calculator</h3>
                <input type="date" id="dob">
                <button onclick="calcAge()">Calculate</button>
                <div class="result" id="ageResult"></div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
